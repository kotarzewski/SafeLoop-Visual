[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safeloop-visual"
version = "0.1.0"
description = "A local, least-privilege MCP visual development loop for Codex and game/app projects."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SafeLoop contributors"}]
keywords = ["mcp", "codex", "godot", "visual-qa", "ai-agent", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
safeloop-visual = "safeloop_visual.cli:main"
safeloop-visual-mcp = "safeloop_visual.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safeloop_visual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
